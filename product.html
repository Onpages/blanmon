<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF7">
<title>Очищающее молочко — БЛАНМОН</title>
<meta name="description" content="Карточка товара Бланмон: очищающее молочко, состав и объём.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header>
  <div class="shell">
    <div class="hrow">
      <a class="brand" href="index.html" aria-label="БЛАНМОН — на главную">
        <span class="wordmark">БЛАНМОН</span>
      </a>
      <a class="cart-link" href="cart.html">Корзина · <b data-cart-count>0</b></a>
    </div>
    <nav class="tabs" aria-label="Разделы">
      <a href="index.html#catalog">Каталог</a>
      <a href="index.html#tea">Чай</a>
      <a href="index.html#brands">Бренды</a>
      <a href="index.html#about">О нас</a>
      <a href="index.html#delivery">Доставка</a>
    </nav>
  </div>
</header>
<main class="shell">

  <div class="product" id="p"></div>

</main>
<footer>
  <div class="shell inner">
    <div class="fmark"><span class="wordmark" style="font-size:15px">БЛАНМОН</span></div>
    <p>Бланмон — вымышленный интернет-магазин женской косметики. Реквизит для кинопроекта: все марки каталога, чайная линейка, цены и адреса не существуют в реальной коммерческой деятельности.</p>
    <p class="cap" style="color:#8A7466;letter-spacing:.16em">Реквизит · ноябрь 2026</p>
  </div>
</footer>
<script src="assets/app.js"></script>

<script>
(function(){
  var B = window.BLANMON, id = new URLSearchParams(location.search).get('id');
  var p = B.byId(id) || B.PRODUCTS[0];
  var isTea = p.kind === 'tea';
  var label = isTea ? ('Травяной чай ' + p.name + ' — БЛАНМОН') : ('Очищающее молочко ' + p.brand + ' — БЛАНМОН');
  var alt = isTea ? ('Травяной чай ' + p.name + ' — упаковка, студийное фото') : ('Очищающее молочко ' + p.brand + ' — упаковка, студийное фото');
  var meta1 = isTea ? 'Травяной чай · БЛАНМОН' : 'Очищающее молочко для лица';
  var meta2 = isTea ? 'пакетики в индивидуальной упаковке' : p.vol;
  document.title = label;
  var m = document.querySelector('meta[name=description]');
  if (m) m.setAttribute('content', p.desc);
  document.getElementById('p').innerHTML =
    '<div class="photo"><img src="assets/products/' + p.file + '" alt="' + alt + '" width="928" height="1152"></div>' +
    '<h1>' + (isTea ? p.name : p.brand) + '</h1>' +
    '<div class="meta"><span class="cap">' + meta1 + '</span><span class="cap">' + meta2 + '</span></div>' +
    '<p class="lead">' + p.desc + '</p>' +
    (isTea ? '<p class="cap" style="margin:10px 0 0">Состав: ' + p.compo + '</p>' : '') +
    '<div class="price-lg">' + B.money(p.price) + '</div>' +
    '<div class="actions">' +
      '<button class="btn" type="button" data-add="' + p.id + '">В корзину</button>' +
      '<a class="btn ghost" href="cart.html">Перейти в корзину</a>' +
    '</div>' +
    '<a class="back" href="index.html#catalog">Назад в каталог</a>';
})();
</script>

</body>
</html>
